  <script>
  (function () {
    function isMobileGallery() {
      return document.body.classList.contains('gallery') && window.matchMedia('(max-width: 767px)').matches;
    }

    function showSlideContent(slide) {
      for (var i = 0; i < slide.children.length; i++) {
        slide.children[i].style.setProperty('display', 'block', 'important');
      }
    }

    function applyMobileGalleryFallback() {
      if (!isMobileGallery()) {
        return;
      }

      var slider = document.querySelector('body.gallery .flexslider');
      var viewport = document.querySelector('body.gallery .flex-viewport');
      var slides = document.querySelectorAll('#assets .slides > li');
      var slidesList = document.querySelector('#assets .slides');
      var pagination = document.querySelector('#assets .pagination');
      var directionNav = document.querySelector('#assets .flex-direction-nav');
      var galleryNav = document.querySelector('#assets .navigation');

      if (slider) {
        slider.style.setProperty('overflow', 'visible', 'important');
        slider.style.setProperty('height', 'auto', 'important');
        slider.style.setProperty('opacity', '1', 'important');
      }

      if (viewport) {
        viewport.style.setProperty('overflow', 'visible', 'important');
        viewport.style.setProperty('max-height', 'none', 'important');
        viewport.style.setProperty('height', 'auto', 'important');
      }

      if (slidesList) {
        slidesList.style.setProperty('display', 'block', 'important');
        slidesList.style.setProperty('width', 'auto', 'important');
        slidesList.style.setProperty('transform', 'none', 'important');
      }

      for (var i = 0; i < slides.length; i++) {
        var slide = slides[i];

        if (slide.classList.contains('clone')) {
          slide.style.setProperty('display', 'none', 'important');
          continue;
        }

        slide.style.setProperty('display', 'block', 'important');
        slide.style.setProperty('float', 'none', 'important');
        slide.style.setProperty('width', '100%', 'important');
        slide.style.setProperty('margin-right', '0', 'important');
        slide.style.setProperty('opacity', '1', 'important');
        slide.style.setProperty('position', 'static', 'important');
        slide.style.setProperty('z-index', 'auto', 'important');
        slide.style.setProperty('min-width', '100%', 'important');
        showSlideContent(slide);
      }

      if (pagination) {
        pagination.style.setProperty('display', 'none', 'important');
      }

      if (directionNav) {
        directionNav.style.setProperty('display', 'none', 'important');
      }

      if (galleryNav) {
        galleryNav.style.setProperty('display', 'none', 'important');
      }
    }

    function queueGalleryRefreshes() {
      applyMobileGalleryFallback();
      window.setTimeout(applyMobileGalleryFallback, 100);
      window.setTimeout(applyMobileGalleryFallback, 500);
      window.setTimeout(applyMobileGalleryFallback, 1200);
    }

    queueGalleryRefreshes();
    window.addEventListener('load', queueGalleryRefreshes);
    window.addEventListener('pageshow', queueGalleryRefreshes);
    window.addEventListener('resize', applyMobileGalleryFallback);

    if (window.jQuery) {
      window.jQuery(document).on('page:load page:restore page:change', queueGalleryRefreshes);
    }
  })();
